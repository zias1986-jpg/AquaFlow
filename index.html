<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaFlow Ledger - Water Supply & Bottle Tracking</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#e0f2fe',
                            100: '#bae6fd',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-gradient-to-r from-brand-700 to-brand-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-white/10 p-2.5 rounded-xl backdrop-blur-sm border border-white/25">
                    <i class="fa-solid fa-water text-2xl text-cyan-300"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-tight">AquaFlow Ledger</h1>
                    <p class="text-xs text-brand-100">Daily Water Bottle Delivery & Deposit Tracker</p>
                </div>
            </div>
            <div class="flex items-center gap-3 w-full sm:w-auto justify-end flex-wrap">
                <button onclick="sendViaEmail()" class="bg-sky-600 hover:bg-sky-700 text-white text-xs sm:text-sm font-medium px-4 py-2 rounded-lg shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-envelope"></i> Send Email
                </button>
                <button onclick="exportToCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-medium px-4 py-2 rounded-lg shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-file-excel"></i> Export CSV
                </button>
                <button onclick="window.print()" class="bg-white/10 hover:bg-white/20 text-white text-xs sm:text-sm font-medium px-4 py-2 rounded-lg border border-white/25 transition flex items-center gap-2">
                    <i class="fa-solid fa-print"></i> Print
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex-grow w-full space-y-6">

        <!-- Summary Metric Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">Total Entries</p>
                    <h3 id="statTotalEntries" class="text-xl font-bold text-slate-800 mt-1">0</h3>
                </div>
                <div class="bg-brand-50 text-brand-600 p-3 rounded-lg">
                    <i class="fa-solid fa-clipboard-list text-lg"></i>
                </div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">Total Revenue (₹)</p>
                    <h3 id="statTotalRevenue" class="text-xl font-bold text-emerald-600 mt-1">₹0.00</h3>
                </div>
                <div
